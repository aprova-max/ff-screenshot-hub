<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FF Screenshot Hub</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#100d19;color:#f7f2ff;font:16px system-ui,Arial}header{padding:26px;background:#1a1230;border-bottom:1px solid #493568}main{max-width:950px;margin:24px auto;padding:0 16px}.brand{font-size:25px;font-weight:800}.muted{color:#b9abc9;font-size:13px}.panel,.card{background:#1b1628;border:1px solid #3c2d51;border-radius:15px;padding:16px;margin:14px 0}h2{font-size:18px;margin:0 0 12px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input{background:#100d19;color:white;border:1px solid #59446e;border-radius:9px;padding:12px;width:100%}.field{flex:1 1 220px}.btn{background:#914cf0;color:white;border:0;border-radius:9px;padding:12px 16px;font-weight:700;cursor:pointer}.secondary{background:#39264f}.danger{background:#71304b}.status{background:#100d19;border:1px solid #493568;border-radius:10px;padding:12px;margin:16px 0}.hidden{display:none!important}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.card{margin:0;padding:10px}.card img{width:100%;height:210px;object-fit:contain;background:#08060c;border-radius:8px}.date{font-size:12px;color:#b9abc9;margin:8px}.empty{padding:32px;text-align:center;border:1px dashed #59446e;border-radius:12px;color:#b9abc9}@media(max-width:500px){.btn{width:100%}.card .btn{width:auto;flex:1}}
</style></head><body>
<header><div class="brand">📸 FF Screenshot Hub</div><div class="muted">Seus comprovantes de vitória em um só lugar.</div></header>
<main><div id="status" class="status">Carregando…</div>
<section id="auth" class="panel hidden"><h2>Entrar ou criar conta</h2><p class="muted">Use a mesma conta no iPhone e no computador.</p><div class="row"><div class="field"><input id="email" type="email" placeholder="E-mail"></div><div class="field"><input id="password" type="password" placeholder="Senha (mínimo 6 caracteres)"></div></div><div class="row" style="margin-top:12px"><button class="btn" id="login">Entrar</button><button class="btn secondary" id="signup">Criar conta</button></div></section>
<section id="app" class="hidden"><div class="panel"><div class="row" style="justify-content:space-between"><h2>Enviar print</h2><button id="logout" class="btn secondary">Sair</button></div><p class="muted">No iPhone, escolha uma captura e envie. No PC ela aparecerá na galeria.</p><div class="row"><div class="field"><input id="file" type="file" accept="image/*"></div><button id="upload" class="btn">Enviar print</button></div></div>
<div class="panel"><div class="row" style="justify-content:space-between"><h2>Meus prints</h2><button id="refresh" class="btn secondary">Atualizar</button></div><div id="gallery" class="gallery"><div class="empty">Nenhum print ainda.</div></div></div></section></main>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import {SUPABASE_URL,SUPABASE_ANON_KEY} from './config.js';
const $=id=>document.getElementById(id);let sb,user,timer;
function msg(t){$('status').textContent=t}function authView(){$('auth').classList.remove('hidden');$('app').classList.add('hidden')}function appView(){$('auth').classList.add('hidden');$('app').classList.remove('hidden')}
async function init(){if(SUPABASE_URL.includes('COLE_')||SUPABASE_ANON_KEY.includes('COLE_')){msg('Configure config.js com os dados do Supabase.');authView();return}
sb=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const {data:{session}}=await sb.auth.getSession();if(session){user=session.user;appView();await load();timer=setInterval(load,5000)}else{authView();msg('Entre ou crie sua conta.')}
sb.auth.onAuthStateChange(async(_,s)=>{if(s){user=s.user;appView();await load();clearInterval(timer);timer=setInterval(load,5000)}else{user=null;authView();clearInterval(timer)}})}
async function account(signup){let email=$('email').value.trim(),password=$('password').value;if(!email||password.length<6){msg('Digite e-mail e senha com pelo menos 6 caracteres.');return}msg('Aguarde…');let r=signup?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});if(r.error)msg(r.error.message);else if(signup&&!r.data.session)msg('Conta criada! Confirme o e-mail recebido e depois entre.');else msg('Login realizado.')}
$('login').onclick=()=>account(false);$('signup').onclick=()=>account(true);$('logout').onclick=()=>sb.auth.signOut();$('refresh').onclick=load;
$('upload').onclick=async()=>{let f=$('file').files[0];if(!f){msg('Escolha uma imagem.');return}if(!f.type.startsWith('image/')){msg('Escolha um arquivo de imagem.');return}if(f.size>20*1024*1024){msg('Imagem maior que 20 MB.');return}
$('upload').disabled=true;msg('Enviando…');try{let ext=(f.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,'');let path=user.id+'/'+crypto.randomUUID()+'.'+ext;let up=await sb.storage.from('prints').upload(path,f,{contentType:f.type});if(up.error)throw up.error;let ins=await sb.from('screenshot_records').insert({user_id:user.id,object_path:path});if(ins.error){await sb.storage.from('prints').remove([path]);throw ins.error}$('file').value='';msg('Print enviado!');await load()}catch(e){msg('Erro: '+e.message)}finally{$('upload').disabled=false}};
async function load(){if(!user)return;let r=await sb.from('screenshot_records').select('id,object_path,created_at').order('created_at',{ascending:false}).limit(100);if(r.error){msg('Erro ao carregar: '+r.error.message);return}if(!r.data.length){$('gallery').innerHTML='<div class="empty">Nenhum print ainda. Envie o primeiro pelo iPhone!</div>';return}
let html=[];for(let x of r.data){let s=await sb.storage.from('prints').createSignedUrl(x.object_path,3600);if(s.error)continue;let date=new Date(x.created_at).toLocaleString('pt-BR');html.push(`<article class="card"><img src="${s.data.signedUrl}"><div class="date">${date}</div><div class="row"><button class="btn copy" data-url="${s.data.signedUrl}">Copiar</button><button class="btn danger del" data-id="${x.id}" data-path="${x.object_path}">Excluir</button></div></article>`)}
$('gallery').innerHTML=html.join('')||'<div class="empty">Não foi possível exibir os prints.</div>';
document.querySelectorAll('.copy').forEach(b=>b.onclick=async()=>{try{let res=await fetch(b.dataset.url),blob=await res.blob();await navigator.clipboard.write([new ClipboardItem({[blob.type]:blob})]);msg('Copiado! Cole no Discord com Ctrl+V.')}catch{msg('Cópia bloqueada pelo navegador. Baixe a imagem para enviar.')}});
document.querySelectorAll('.del').forEach(b=>b.onclick=async()=>{if(!confirm('Excluir este print?'))return;let d=await sb.storage.from('prints').remove([b.dataset.path]);if(d.error){msg(d.error.message);return}let q=await sb.from('screenshot_records').delete().eq('id',b.dataset.id);if(q.error){msg(q.error.message);return}msg('Print excluído.');load()})}
init();
</script></body></html>
